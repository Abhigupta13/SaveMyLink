<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f1e1d" />
  <title>ALL you need</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1f1e1d;
      --bg-card: #262624;
      --text: #faf9f5;
      --muted: #b0ada3;
      --accent: #e08a6a;
      --accent-strong: #c2552f;
      --border: #3a3937;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: var(--text);
    }
    .wrap {
      min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: 28px 20px calc(28px + env(safe-area-inset-bottom));
    }
    .card {
      max-width: 380px; width: 100%; text-align: center;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 24px;
      padding: 32px 24px 28px;
    }
    .icon {
      width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 16px;
      background: rgba(224, 138, 106, 0.12); color: var(--accent);
      display: flex; align-items: center; justify-content: center;
    }
    h1 { font-size: 1.15rem; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.02em; }
    p { margin: 0 0 22px; font-size: 0.9rem; line-height: 1.55; color: var(--muted); font-weight: 600; }
    button {
      appearance: none; border: none; cursor: pointer; font: inherit; font-weight: 800;
      min-height: 48px; padding: 0 24px; border-radius: 14px; width: 100%;
      background: linear-gradient(135deg, #d97757 0%, #a83e1b 100%); color: #fff;
    }
    button:active { opacity: 0.92; }
    .brand { margin-top: 20px; font-size: 0.72rem; font-weight: 700; color: #93908a; letter-spacing: 0.04em; text-transform: uppercase; }
    #connecting { display: none; }
    body.connecting #shell { display: none; }
    body.connecting #connecting { display: block; text-align: center; color: var(--muted); font-weight: 600; font-size: 0.9rem; }
  </style>
</head>
<body class="connecting">
  <div class="wrap">
    <p id="connecting">Opening ALL you need…</p>
    <div id="shell" hidden>
      <div class="card">
        <div class="icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/>
          </svg>
        </div>
        <h1>No connection</h1>
        <p>Wi‑Fi or mobile data isn’t reachable right now. Turn on a network connection, then try again.</p>
        <button type="button" id="retry">Try again</button>
        <div class="brand">ALL you need</div>
      </div>
    </div>
  </div>
  <script>
    /** Keep in sync with PRODUCTION_URL in capacitor.config.ts and CANONICAL_APP_URL in src/lib/url.ts */
    var FALLBACK_APP_URL = 'https://allyouneedvault.vercel.app';

    function resolveAppUrl() {
      return fetch('capacitor.config.json', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (cfg) {
          var u = cfg && cfg.server && cfg.server.url;
          return (u && String(u).trim()) || FALLBACK_APP_URL;
        })
        .catch(function () { return FALLBACK_APP_URL; });
    }

    function showOffline() {
      document.body.classList.remove('connecting');
      document.getElementById('shell').hidden = false;
    }

    function goOnline(appUrl) {
      window.location.replace(appUrl);
    }

    function attemptLaunch(forcedOffline) {
      resolveAppUrl().then(function (appUrl) {
        if (forcedOffline || !navigator.onLine) {
          showOffline();
          return;
        }
        goOnline(appUrl);
      });
    }

    var params = new URLSearchParams(window.location.search);
    var forcedOffline = params.get('offline') === '1';

    document.getElementById('retry').addEventListener('click', function () {
      document.body.classList.add('connecting');
      document.getElementById('shell').hidden = true;
      attemptLaunch(false);
    });

    window.addEventListener('online', function () {
      document.body.classList.add('connecting');
      document.getElementById('shell').hidden = true;
      attemptLaunch(false);
    });

    attemptLaunch(forcedOffline);
  </script>
</body>
</html>
